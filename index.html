<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>day04</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    padding: 24px 16px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: #666;
    font-size: 0.9rem;
    margin: 0 0 20px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.link-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-radius: 10px;
    background: #f3f4f6;
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: background 0.15s ease;
  }
  a.link-item:hover { background: #e5e7eb; }
  a.link-item span.arrow { color: #9ca3af; }
  @media (prefers-color-scheme: dark) {
    body { background: #111318; color: #e5e7eb; }
    .card { background: #1c1f26; border-color: #2a2e37; }
    p.subtitle { color: #9aa0aa; }
    a.link-item { background: #22262f; color: #e5e7eb; }
    a.link-item:hover { background: #2a2e37; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>day04</h1>
    <p class="subtitle">페이지 목록</p>
    <ul>
      <li>
        <a class="link-item" href="preview.html">
          Todo 목록 미리보기
          <span class="arrow">&rarr;</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
