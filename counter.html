<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카운터</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    font-family: sans-serif;
  }
  .container {
    text-align: center;
  }
  #count {
    font-size: 12rem;
    font-weight: bold;
    color: red;
    line-height: 1;
  }
  button {
    margin-top: 2rem;
    font-size: 1.5rem;
    padding: 0.75rem 2rem;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #357abd;
  }
</style>
</head>
<body>
  <div class="container">
    <div id="count">0</div>
    <button onclick="increment()">+1</button>
  </div>
  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    function increment() {
      count++;
      countEl.textContent = count;
    }
  </script>
</body>
</html>
