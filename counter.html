<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카운터</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #002F6C 0%, #0047AB 100%);
    font-family: sans-serif;
  }
  .container {
    text-align: center;
  }
  #count {
    font-size: 12rem;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
  }
  button {
    margin-top: 2rem;
    font-size: 1.5rem;
    padding: 0.75rem 2rem;
    border: none;
    border-radius: 8px;
    background: #ffffff;
    color: #0047AB;
    font-weight: 700;
    cursor: pointer;
  }
  button:active {
    background: #cddcf7;
  }
  a.back {
    display: inline-block;
    margin-top: 2rem;
    font-size: 1rem;
    font-weight: 600;
    color: #cddcf7;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <div id="count">0</div>
    <button onclick="increment()">+1</button>
    <div><a class="back" href="index.html">← 홈으로 돌아가기</a></div>
  </div>
  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    function increment() {
      count++;
      countEl.textContent = count;
    }
  </script>
</body>
</html>
