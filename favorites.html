<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내가 좋아하는 것들</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  h1 {
    margin: 0 0 0.5rem 0;
    font-size: 2rem;
    color: #222;
  }
  .cards {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    width: 220px;
    padding: 1.5rem;
    border-radius: 12px;
    background: #f7f7f7;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    text-align: center;
  }
  .card h2 {
    margin: 0 0 0.5rem 0;
    font-size: 1.3rem;
    color: #222;
  }
  .card p {
    margin: 0;
    font-size: 1rem;
    color: #666;
  }
</style>
</head>
<body>
  <h1>내가 좋아하는 것들</h1>
  <div class="cards">
    <div class="card">
      <h2>☕ 커피</h2>
      <p>하루를 시작하는 데 빠질 수 없는 즐거움이에요.</p>
    </div>
    <div class="card">
      <h2>🎬 영화</h2>
      <p>새로운 이야기에 빠져드는 시간을 좋아해요.</p>
    </div>
    <div class="card">
      <h2>✈️ 여행</h2>
      <p>낯선 곳을 걸으며 새로운 것을 발견하는 게 좋아요.</p>
    </div>
  </div>
</body>
</html>
